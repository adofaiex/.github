name: Generate Metrics & Contributor Graph

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: ["main"]
    paths-ignore:                      # 图表文件更新不触发本 workflow，切断自触发链
      - 'metrics-left.svg'
      - 'metrics-right.svg'
      - 'adofaiex.svg'
      - 'adofaiex.html'

permissions:
  contents: write

# ★ 核心：全局串行，同一时间只允许一个 run 操作 main
concurrency:
  group: metrics-and-contributor-graph
  cancel-in-progress: false

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Metrics (left)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: adofaiex
          template: classic
          filename: metrics-left.svg
          config_timezone: Asia/Shanghai
          base: header, repositories, metadata
          plugin_introduction: yes
          plugin_traffic: yes

      - name: Generate Metrics (right)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: adofaiex
          template: classic
          filename: metrics-right.svg
          config_timezone: Asia/Shanghai
          base: ""
          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_languages_threshold: 0%
          plugin_followup: yes

  contributor-graph:
    needs: metrics                    # ★ 关键：等 metrics 全部 push 完再开始
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0              # rebase 需要完整历史

      - name: Sync with remote and generate SVG
        run: |
          git fetch origin main
          git reset --hard origin/main
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            -e GITHUB_TOKEN=${{ secrets.METRICS_TOKEN }} \
            ghcr.io/ewels/contributor-graphs adofaiex --sort commits 2>&1 | tee output.log

      - name: List files
        run: |
          ls -la
          find . -name "*.svg" -type f

      - name: Commit and push if changed (with retry)
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          if [ ! -f "adofaiex.svg" ]; then
            echo "SVG file not found, skipping commit"
            exit 1
          fi

          git add adofaiex.svg adofaiex.html

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "📊 update contributor graph [skip ci]"

          # ★ 重试兜底：即使有未知并发，也能最终 push 成功
          for i in 1 2 3 4 5; do
            if git push origin main; then
              echo "Push succeeded"
              exit 0
            fi
            echo "Push rejected, retry $i/5..."
            git pull --rebase origin main || git rebase --abort
            sleep $((i * 3))
          done

          echo "Push failed after retries"
          exit 1
