name: Generate Metrics & Contributor Graph

on:
  schedule:
    - cron: '0 0 * * *'          # 每天 UTC 0 点运行
  workflow_dispatch:              # 允许手动触发
  push:
    branches: ["main"]

permissions:
  contents: write                 # 允许提交到仓库

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Metrics (left)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: adofaiex
          template: classic
          filename: metrics-left.svg
          config_timezone: Asia/Shanghai
          base: header, repositories, metadata
          plugin_introduction: yes
          plugin_traffic: yes

      - name: Generate Metrics (right)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: adofaiex
          template: classic
          filename: metrics-right.svg
          config_timezone: Asia/Shanghai
          base: ""
          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_languages_threshold: 0%
          plugin_lines: yes
          plugin_lines_sections: base
          plugin_followup: yes
          # 如需组织 Projects 看板，取消下面三行注释并填好项目
          # plugin_projects: yes
          # plugin_projects_repositories: adofaiex/xxx/projects/1

  contributor-graph:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Sync with remote and generate SVG
        run: |
          # 强制与远程保持一致，丢弃本地可能的旧修改
          git fetch origin main
          git reset --hard origin/main

          # 生成 contributor graph
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            -e GITHUB_TOKEN=${{ secrets.METRICS_TOKEN }} \
            ghcr.io/ewels/contributor-graphs adofaiex --sort commits 2>&1 | tee output.log

      - name: List files (optional)
        run: |
          ls -la
          find . -name "*.svg" -type f

      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          if [ ! -f "adofaiex.svg" ]; then
            echo "SVG file not found, skipping commit"
            exit 1
          fi

          git add adofaiex.svg adofaiex.html

          # 检查是否有实际变更
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "📊 update contributor graph [skip ci]"
          git push
