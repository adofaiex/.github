name: Generate Metrics & Contributor Graph

on:
  schedule:
    - cron: '0 0 * * *'          # 每天 UTC 0 点运行
  workflow_dispatch:              # 允许手动触发
  push:
    branches: ["main"]

permissions:
  contents: write                 # 允许提交到仓库

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Metrics (left)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: adofaiex
          template: classic
          filename: metrics-left.svg
          config_timezone: Asia/Shanghai
          base: header, repositories, metadata
          plugin_introduction: yes
          plugin_traffic: yes

      - name: Generate Metrics (right)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: adofaiex
          template: classic
          filename: metrics-right.svg
          config_timezone: Asia/Shanghai
          base: ""
          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_languages_threshold: 0%
          plugin_lines: yes
          plugin_lines_sections: base
          plugin_followup: yes
          # 如需组织 Projects 看板，取消下面三行注释并填好项目
          # plugin_projects: yes
          # plugin_projects_repositories: adofaiex/xxx/projects/1

  contributor-graph:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate contributor graph SVG
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -e GITHUB_TOKEN=${{ secrets.METRICS_TOKEN }} \
            ghcr.io/ewels/contributor-graphs adofaiex

      - name: Commit and push the generated SVG
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add contributors.svg contributors.html
          git commit -m "📊 update contributor graph [skip ci]" || echo "No changes to commit"
          git push
